name: sync-from-webdav

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webdav-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pull bundle from WebDAV
        env:
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
        run: node tools/apply-webdav-bundle.mjs
      - name: Commit changes
        run: |
          git config user.name "都有文明每天"
          git config user.email "3645411938@qq.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -m "sync: from WebDAV $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
